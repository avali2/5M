# 5 MILLIONS — configuración para Fly.io
# Opción gratuita (requiere registrar tarjeta una sola vez; el plan de $0
# cubre una VM shared-cpu-1x y volumen dentro del allowance).
#
# fly launch genera/sobrescribe este archivo. Verifica que "app" coincida
# con el nombre de tu app en Fly. Si cambias el nombre, actualiza aquí.

app = "five-millions"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# 256 MB está dentro del allowance gratuito. Si el escaneo sufre OOM,
# sube a 512 MB (costo mínimo) o pasa a Oracle Cloud Always Free.
[vm]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "five_millions_data"
  destination = "/app/data"