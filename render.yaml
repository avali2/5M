services:
  - type: web
    name: five-millions
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: REQUIRE_ACCESS_KEY
        value: "true"
      - key: APP_ACCESS_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRADIER_TOKEN
        sync: false
      - key: TRADIER_BASE_URL
        value: https://api.tradier.com/v1
      - key: TRADIER_SANDBOX
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_REQUIRED
        value: "true"
      - key: WATCHLIST_CORE
        value: AAPL,MSFT,NVDA,AMZN,META,GOOGL,TSLA,SPY,QQQ,IWM,DIA
      - key: MAGNIFICENT_7
        value: AAPL,MSFT,NVDA,AMZN,META,GOOGL,TSLA
      - key: MIN_DTE
        value: "21"
      - key: MAX_DTE
        value: "45"
      - key: ACCOUNT_SIZE
        value: "2000"
      - key: RISK_PER_TRADE_PCT
        value: "1"
      - key: MAX_CONTRACTS
        value: "3"
      - key: MIN_POP
        value: "0.60"
      - key: MIN_SCORE
        value: "70"
      - key: MIN_CREDIT
        value: "0.10"
      - key: MAX_DAILY_SIGNALS
        value: "3"
      - key: SCAN_INTERVAL_MINUTES
        value: "5"
      - key: MARKET_OPEN_ONLY
        value: "true"
      - key: SCANNER_ENABLED
        value: "true"
      - key: PUSH_ENABLED
        value: "true"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data
