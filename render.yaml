services:
  - type: web
    name: five-millions
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: five-millions-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: REQUIRE_ACCESS_KEY
        value: "true"
      - key: APP_ACCESS_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRADIER_TOKEN
        sync: false
      - key: TRADIER_BASE_URL
        value: https://api.tradier.com/v1
      - key: TRADIER_SANDBOX
        value: "false"
      - key: TRADIER_REALTIME_ENTITLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_REQUIRED
        value: "true"
      - key: NEWS_CACHE_MINUTES
        value: "15"
      - key: NEWS_MIN_SOURCES
        value: "3"
      - key: NEWS_MAX_CLEAR_RISK
        value: "35"
      - key: PRIORITY_SYMBOLS
        value: AMD,MSFT,SPY
      - key: INDEX_PROXIES
        value: SPY,QQQ,IWM,DIA
      - key: CONTEXT_INDICES
        value: SPX,NDX,RUT,VIX
      - key: WATCHLIST_CORE
        value: AMD,MSFT,SPY,QQQ,IWM,DIA,SOFI,MARA,AAPL,NVDA,AMZN,META,GOOGL,TSLA,AVGO,PLTR,NFLX,HOOD,MU,ORCL,TSM,BABA,BAC,COIN,SMH,XLK,XLF,XLE,TLT,IBIT
      - key: MAGNIFICENT_7
        value: AAPL,MSFT,NVDA,AMZN,META,GOOGL,TSLA
      - key: OPTIONS_LEADERS
        value: AMD,AVGO,PLTR,NFLX,HOOD,MU,ORCL,TSM,BABA,BAC,COIN
      - key: SECTOR_MACRO_ETFS
        value: SMH,XLK,XLF,XLE,TLT,IBIT
      - key: WHEEL_SYMBOLS
        value: SOFI,MARA
      - key: MAX_SYMBOLS_PER_SCAN
        value: "12"
      - key: WATCHLIST_ROTATION_ENABLED
        value: "true"
      - key: MIN_DTE
        value: "21"
      - key: MAX_DTE
        value: "45"
      - key: TARGET_DTE
        value: "30"
      - key: CORE_SHORT_DELTA_MIN
        value: "0.12"
      - key: CORE_SHORT_DELTA_MAX
        value: "0.30"
      - key: CORE_MIN_LIQUIDITY
        value: "40"
      - key: AGGRESSIVE_ENABLED
        value: "true"
      - key: AGGRESSIVE_PRIORITY_ONLY
        value: "false"
      - key: AGGRESSIVE_MIN_DTE
        value: "7"
      - key: AGGRESSIVE_MAX_DTE
        value: "20"
      - key: AGGRESSIVE_TARGET_DTE
        value: "14"
      - key: AGGRESSIVE_SHORT_DELTA_MIN
        value: "0.24"
      - key: AGGRESSIVE_SHORT_DELTA_MAX
        value: "0.40"
      - key: AGGRESSIVE_MIN_LIQUIDITY
        value: "50"
      - key: AGGRESSIVE_MAX_CONTRACTS
        value: "999"
      - key: ACCOUNT_SIZE
        value: "0"
      - key: RISK_PER_TRADE_PCT
        value: "1"
      - key: MAX_CONTRACTS
        value: "999"
      - key: MAXIMUM_SPREAD_WIDTH
        value: "25"
      - key: MIN_POP
        value: "0.60"
      - key: MIN_SCORE
        value: "70"
      - key: MIN_CREDIT
        value: "0.10"
      - key: MAX_DAILY_SIGNALS
        value: "3"
      - key: REQUIRE_AFFORDABLE_SIGNAL
        value: "false"
      - key: INSTITUTIONAL_FLOW_ENABLED
        value: "true"
      - key: INSTITUTIONAL_FLOW_REQUIRED_FOR_AGGRESSIVE
        value: "true"
      - key: INSTITUTIONAL_FLOW_MIN_CONFIDENCE
        value: "55"
      - key: INSTITUTIONAL_FLOW_MIN_VOLUME
        value: "100"
      - key: INSTITUTIONAL_FLOW_MIN_VOLUME_OI
        value: "0.5"
      - key: WHEEL_ENABLED
        value: "true"
      - key: WHEEL_MIN_DTE
        value: "14"
      - key: WHEEL_MAX_DTE
        value: "45"
      - key: WHEEL_TARGET_DTE
        value: "30"
      - key: WHEEL_SHORT_DELTA_MIN
        value: "0.15"
      - key: WHEEL_SHORT_DELTA_MAX
        value: "0.35"
      - key: WHEEL_MIN_LIQUIDITY
        value: "45"
      - key: WHEEL_MIN_SCORE
        value: "70"
      - key: MIN_TIMEFRAMES
        value: "3"
      - key: MAX_DATA_AGE_MINUTES
        value: "20"
      - key: SCAN_INTERVAL_MINUTES
        value: "5"
      - key: MANUAL_SCAN_COOLDOWN_SECONDS
        value: "60"
      - key: MARKET_OPEN_ONLY
        value: "true"
      - key: SCANNER_ENABLED
        value: "true"
      - key: PUSH_ENABLED
        value: "true"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: LEARNING_ENABLED
        value: "true"
      - key: LEARNING_MIN_VALIDATED_SAMPLES
        value: "20"
